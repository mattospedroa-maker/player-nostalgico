name: Gerar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Chave de assinatura fixa (permite instalar por cima sem perder os dados)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks; echo "usando a chave fixa"; elif [ -f android/app/chave-fixa.jks ]; then echo "usando a chave fixa do repositorio"; else echo "sem chave fixa: assina com a chave de debug do CI"; fi
      - name: Conferir as chaves das APIs (só diz se existem, nunca mostra o valor)
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: |
          for k in LASTFM_KEY GIPHY_KEY GEMINI_KEY MISTRAL_KEY; do
            v="${!k}"
            if [ -n "$v" ]; then echo "$k: configurada (${#v} caracteres)"; else echo "::warning::$k não configurada: o APK sai sem ela"; fi
          done
          # teste de verdade da chave do Gemini (lista os modelos; a chave vai no cabeçalho, nunca aparece no log)
          if [ -n "$GEMINI_KEY" ]; then
            case "$GEMINI_KEY" in *[[:space:]]*|*\"*|*=*) echo "::warning::GEMINI_KEY tem espaço, aspas ou '=': cole só a chave no segredo";; esac
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-goog-api-key: $GEMINI_KEY" https://generativelanguage.googleapis.com/v1beta/models || echo erro)
            if [ "$code" = 200 ]; then echo "GEMINI_KEY: o Google aceitou a chave (HTTP 200)"; else echo "::warning::GEMINI_KEY: o Google recusou a chave (HTTP $code)"; fi
          fi
          if [ -n "$MISTRAL_KEY" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $MISTRAL_KEY" https://api.mistral.ai/v1/models || echo erro)
            if [ "$code" = 200 ]; then echo "MISTRAL_KEY: a Mistral aceitou a chave (HTTP 200)"; else echo "::warning::MISTRAL_KEY: a Mistral recusou a chave (HTTP $code)"; fi
          fi
      - run: flutter build apk --release --target-platform android-arm64 --build-name=2.1.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=2.1.${{ github.run_number }} --dart-define=LASTFM_KEY="$LASTFM_KEY" --dart-define=GIPHY_KEY="$GIPHY_KEY" --dart-define=GEMINI_KEY="$GEMINI_KEY" --dart-define=MISTRAL_KEY="$MISTRAL_KEY"
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Conferir que o APK saiu com a chave fixa (instala por cima sem perder dados)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256"
          if $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q "CN=Android Debug"; then
            echo "::warning::APK assinado com chave de debug: não vai instalar por cima da versão anterior"
          fi
      - name: Conferir arquiteturas e tamanho do APK
        run: |
          ls -la build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep ' lib/' | awk '{print $1, $4}'
      - name: Conferir que o R8 não renomeou o yt-dlp
        run: |
          M=build/app/outputs/mapping/release/mapping.txt
          grep -E '^com\.yausername\.youtubedl_android\.YoutubeDL -> com\.yausername\.youtubedl_android\.YoutubeDL:' $M
          grep -E '^com\.fasterxml\.jackson\.databind\.ObjectMapper -> com\.fasterxml\.jackson\.databind\.ObjectMapper:' $M
      - uses: actions/upload-artifact@v4
        with:
          name: player-nostalgico-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK em Releases
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk player-nostalgico.apk
          gh release create "v2.1.${{ github.run_number }}" player-nostalgico.apk \
            --title "Player Nostálgico 2.1.${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir de ${{ github.sha }}. Baixe player-nostalgico.apk e abra no celular." \
            --latest

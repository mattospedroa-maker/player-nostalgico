name: Gerar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - name: Conferir arquiteturas e tamanho do APK
        run: |
          ls -la build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep ' lib/' | awk '{print $1, $4}'
      - name: Conferir que o R8 não renomeou o yt-dlp
        run: |
          M=build/app/outputs/mapping/release/mapping.txt
          grep -E '^com\.yausername\.youtubedl_android\.YoutubeDL -> com\.yausername\.youtubedl_android\.YoutubeDL:' $M
          grep -E '^com\.fasterxml\.jackson\.databind\.ObjectMapper -> com\.fasterxml\.jackson\.databind\.ObjectMapper:' $M
      - uses: actions/upload-artifact@v4
        with:
          name: player-nostalgico-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK em Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk player-nostalgico.apk
          gh release create "v1.0.${{ github.run_number }}" player-nostalgico.apk \
            --title "Player Nostálgico (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente a partir de ${{ github.sha }}. Baixe player-nostalgico.apk e abra no celular." \
            --latest
